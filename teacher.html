<style>
  :root { --bg:#f7fafc; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --accent:#2563eb; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
  .wrap { max-width: 760px; margin: 1.5rem auto; padding: 0 1rem; }
  .card { background:var(--card); border:1px solid #e5e7eb; border-radius: 16px; padding: 16px; box-shadow: 0 1px 0 rgba(0,0,0,0.02); }
  h1 { font-size: 1.5rem; margin: 0; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size: .9rem; }
  label { font-size:.85rem; color:#374151; }
  select, input, button { font-size:1rem; padding:.6rem .7rem; border-radius:12px; border:1px solid #e5e7eb; background:#fff; color:var(--text); }
  button { background:var(--accent); color:white; border:none; cursor:pointer; }
  button.secondary { background:#eef2ff; color:#1e40af; border:1px solid #c7d2fe; }
  .grid { display:grid; gap:12px; }
  .two { grid-template-columns: 1fr 1fr; }
  .list { max-height: 260px; overflow:auto; border:1px solid #e5e7eb; border-radius:12px; }
  .item { padding:.6rem .8rem; border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between; }
  .item:hover { background:#f8fafc; }
  .pill { display:inline-block; background:#f1f5f9; border:1px solid #e5e7eb; padding:.2rem .5rem; border-radius:999px; font-size:.8rem; color:#475569; }
  .ok { color:#059669; font-weight:600; }
  .warn { color:#b45309; }
  .footer { text-align:center; color:#94a3b8; font-size:.8rem; margin-top: 16px; }
  .totals { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; }
  .totals .cell { border:1px solid #e5e7eb; border-radius:12px; padding:8px; text-align:center; font-size:.9rem; }
  .hide { display:none; }
  .small { font-size:.85rem; }
</style>

    const $ = id => document.getElementById(id);
    const rowsTBody = $("rows"); const totalsDiv = $("totals"); const totalsParentsDiv = $("totalsParents");
    const klassSel = $("klass"), groupSel = $("group"), qInput = $("q");
    const btnRefresh = $("btnRefresh"), btnExport = $("btnExport");

    function groupOf(n) { return n%2===1? "Odd":"Even"; }

    function loadFromLocal() {
      const map = localStorage.getItem("f1_checkins_v1") ? JSON.parse(localStorage.getItem("f1_checkins_v1")) : {}
      const list = Object.keys(map).map(id => {
        const [c, n] = id.split("-");
        const rec = STUDENTS.find(s => s.class===c && s.number===Number(n));
        if (!rec) return null;
        const parents = typeof map[id]==="object" ? Number(map[id].parents||1) : 1;
        const ts = typeof map[id]==="object" ? map[id].ts : map[id];
        return { ts: ts, klass: rec.class, number: rec.number, name: rec.name, group_: groupOf(rec.number), venue: rec.venue, parents_count: parents, source: "local" };
      }).filter(Boolean);
      return list.sort((a,b)=> String(b.ts).localeCompare(String(a.ts)));
    }

    async function load() {
      let list = [];
      if (window.SUPABASE_URL && window.SUPABASE_ANON) {
        try {
          const url = new URL(window.SUPABASE_URL + "/rest/v1/" + (window.SUPABASE_TABLE||"checkins"));
          url.searchParams.set("select","*");
          url.searchParams.set("order","ts.desc");
          const res = await fetch(url.toString(), { headers: { "apikey": window.SUPABASE_ANON, "Authorization": "Bearer " + window.SUPABASE_ANON } });
          if (res.ok) list = await res.json(); else list = loadFromLocal();
        } catch (e) { list = loadFromLocal(); }
      } else { list = loadFromLocal(); }
      window.__ALL_ROWS__ = list;
      render();
    }

    function filteredRows() {
      const k = klassSel.value; const g = groupSel.value; const q = qInput.value.trim().toLowerCase();
      return (window.__ALL_ROWS__||[]).filter(r => (!k || r.klass===k) && (!g || r.group_===g) && (!q || (r.name||"").toLowerCase().includes(q)));
    }

    function render() {
      const data = filteredRows();
      rowsTBody.innerHTML = "";
      for (const r of data) {
        const tr = document.createElement("tr");
        tr.innerHTML = "<td style='padding:8px;'>" + new Date(r.ts).toLocaleTimeString() + "</td>"
                     + "<td style='padding:8px;'>" + r.klass + "</td>"
                     + "<td style='padding:8px;'>" + r.number + "</td>"
                     + "<td style='padding:8px;'>" + r.name + "</td>"
                     + "<td style='padding:8px;'>" + r.group_ + "</td>"
                     + "<td style='padding:8px;'>" + (r.parents_count||1) + "</td>"
                     + "<td style='padding:8px;'>" + r.venue + "</td>"
                     + "<td style='padding:8px;'>" + (r.source||"") + "</td>";
        rowsTBody.appendChild(tr);
      }
      // totals by class-group (students)
      const agg = new Map();
      const aggParents = new Map();
      for (const r of (window.__ALL_ROWS__||[])) {
        const key = r.klass + "-" + r.group_;
        agg.set(key, (agg.get(key)||0)+1);
        aggParents.set(key, (aggParents.get(key)||0) + Number(r.parents_count||1));
      }
      const keys = ["1B-Odd","1B-Even","1G-Odd","1G-Even","1R-Odd","1R-Even","1W-Odd","1W-Even"];
      totalsDiv.innerHTML = keys.map(function(key){
        const n = agg.get(key)||0;
        return "<div class='cell'><div>"+key+" (Students)</div><div style='font-weight:700;font-size:1.2rem;'>"+n+"</div></div>";
      }).join("");
      totalsParentsDiv.innerHTML = keys.map(function(key){
        const n = aggParents.get(key)||0;
        return "<div class='cell'><div>"+key+" (Parents)</div><div style='font-weight:700;font-size:1.2rem;'>"+n+"</div></div>";
      }).join("");
    }

    klassSel.addEventListener("change", render);
    groupSel.addEventListener("change", render);
    qInput.addEventListener("input", render);
    btnRefresh.addEventListener("click", load);

    btnExport.addEventListener("click", () => {
      const data = filteredRows();
      const csv = [ ["ts","class","number","name","group","parents","venue","source"].join(","),
        ...data.map(r => [r.ts,r.klass,r.number,r.name,r.group_,r.parents_count||1,r.venue,r.source].map(x => '"'+String(x||'').replaceAll('"','""')+'"').join(","))
      ].join("\n");
      const blob = new Blob([csv], {type:"text/csv"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "checkins.csv";
      a.click();
    });

    load();
  </script>
</body>
</html>
