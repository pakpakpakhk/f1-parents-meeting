<html lang="en">

<style>
  :root { --bg:#f7fafc; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --accent:#2563eb; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
  .wrap { max-width: 760px; margin: 1.5rem auto; padding: 0 1rem; }
  .card { background:var(--card); border:1px solid #e5e7eb; border-radius: 16px; padding: 16px; box-shadow: 0 1px 0 rgba(0,0,0,0.02); }
  h1 { font-size: 1.5rem; margin: 0; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size: .9rem; }
  label { font-size:.85rem; color:#374151; }
  select, input, button { font-size:1rem; padding:.6rem .7rem; border-radius:12px; border:1px solid #e5e7eb; background:#fff; color:var(--text); }
  button { background:var(--accent); color:white; border:none; cursor:pointer; }
  button.secondary { background:#eef2ff; color:#1e40af; border:1px solid #c7d2fe; }
  .grid { display:grid; gap:12px; }
  .two { grid-template-columns: 1fr 1fr; }
  .list { max-height: 260px; overflow:auto; border:1px solid #e5e7eb; border-radius:12px; }
  .item { padding:.6rem .8rem; border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between; }
  .item:hover { background:#f8fafc; }
  .pill { display:inline-block; background:#f1f5f9; border:1px solid #e5e7eb; padding:.2rem .5rem; border-radius:999px; font-size:.8rem; color:#475569; }
  .ok { color:#059669; font-weight:600; }
  .warn { color:#b45309; }
  .footer { text-align:center; color:#94a3b8; font-size:.8rem; margin-top: 16px; }
  .totals { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; }
  .totals .cell { border:1px solid #e5e7eb; border-radius:12px; padding:8px; text-align:center; font-size:.9rem; }
  .hide { display:none; }
  .small { font-size:.85rem; }
</style>

</head>

        </div>
      </div>

      <div id="byNum">

        <div id="numCandidate" class="hide">

          <div class="row">

              <option value="2">2</option>

      </div>

        <input id="query" placeholder="e.g. WONG" />
        <div class="list" id="results"></div>

    </div>

    const $ = (id) => document.getElementById(id);
    const langSel = $("lang"), hallBrief = $("hallBrief"), lblClass=$("lblClass"), lblMode=$("lblMode"), lblNumber=$("lblNumber"), lblSearch=$("lblSearch"), lblParents=$("lblParents");
    const klassSel = $("klass"), modeSel = $("mode");
    const byNum = $("byNum"), byName = $("byName");
    const numberInput = $("number"), numCandidate = $("numCandidate"), pickedText=$("pickedText"), venueTag=$("venueTag"), btnConfirm=$("btnConfirm"), already=$("already"), parentsSel=$("parents");
    const queryInput = $("query"), resultsDiv = $("results");

    function t() { return STR[langSel.value || "en"]; }
    function i18n() {
      hallBrief.textContent = t().hallBrief;
      lblClass.textContent = t().class;
      lblMode.textContent = t().mode;
      modeSel.options[0].text = t().byNumber;
      modeSel.options[1].text = t().byName;
      lblNumber.textContent = t().number;
      lblSearch.textContent = t().search;
      lblParents.textContent = t().parents;
      btnConfirm.textContent = t().confirm;
    }
    langSel.addEventListener("change", i18n);
    i18n();

    function groupOf(n) { return (n%2===1) ? t().groupOdd : t().groupEven; }
    function idOf(rec) { return rec.class + "-" + rec.number; }

    function findByNumber(klass, num) {
      return STUDENTS.find(s => s.class===klass && s.number===num) || null;
    }

    function renderCandidate(rec) {
      if (!rec) { numCandidate.classList.add("hide"); return; }
      pickedText.textContent = t().picked + ": " + rec.name + " (" + rec.class + " #" + rec.number + ") — " + groupOf(rec.number);
      venueTag.textContent = t().venue + ": " + rec.venue;
      const checked = localStorage.getItem("f1_checkins_v1") ? JSON.parse(localStorage.getItem("f1_checkins_v1")) : {}
      const isAlready = Boolean(checked[idOf(rec)]);
      if (isAlready) already.classList.remove("hide"); else already.classList.add("hide");
      numCandidate.classList.remove("hide");
      btnConfirm.onclick = () => checkIn(rec);
    }

    modeSel.addEventListener("change", () => {
      const m = modeSel.value;
      byNum.classList.toggle("hide", m!=="num");
      byName.classList.toggle("hide", m!=="name");
    });

    numberInput.addEventListener("input", () => {
      const klass = klassSel.value; const n = parseInt(numberInput.value, 10);
      if (!klass || isNaN(n)) { renderCandidate(null); return; }
      renderCandidate(findByNumber(klass, n));
    });

    queryInput.addEventListener("input", () => {
      const q = queryInput.value.trim().toLowerCase(); const klass = klassSel.value;
      resultsDiv.innerHTML = "";
      if (!klass || !q) return;
      const items = STUDENTS.filter(s => s.class===klass && s.name.toLowerCase().includes(q)).slice(0,40);
      for (const s of items) {
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = "<div><strong>" + s.name + "</strong> <span class='muted'>(" + s.class + " #" + s.number + ")</span></div><div class='muted'>" + groupOf(s.number) + "</div>";
        row.onclick = () => { numberInput.value = String(s.number); modeSel.value = "num"; modeSel.dispatchEvent(new Event("change")); renderCandidate(s); };
        resultsDiv.appendChild(row);
      }
    });

    async function checkIn(rec) {
      const id = idOf(rec);
      const map = localStorage.getItem("f1_checkins_v1") ? JSON.parse(localStorage.getItem("f1_checkins_v1")) : {}
      const parents = Number(parentsSel.value||"1");
      if (!map[id]) { map[id] = { ts: new Date().toISOString(), parents: parents }; }
      else { map[id] = { ...map[id], parents: parents }; }
      localStorage.setItem("f1_checkins_v1", JSON.stringify(map));

      if (window.SUPABASE_URL && window.SUPABASE_ANON) {
        try {
          await fetch(window.SUPABASE_URL + "/rest/v1/" + (window.SUPABASE_TABLE||"checkins"), {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": window.SUPABASE_ANON,
              "Authorization": "Bearer " + window.SUPABASE_ANON,
              "Prefer": "return=minimal"
            },
            body: JSON.stringify({
              ts: new Date().toISOString(),
              klass: rec.class,
              number: rec.number,
              name: rec.name,
              group_: (rec.number%2===1? "Odd":"Even"),
              venue: rec.venue,
              parents_count: parents,
              source: "kiosk"
            })
          });
        } catch (e) {}
      }
      renderCandidate(rec);
      alert(t().success + "\n" + t().goTo + rec.venue);
    }
  </script>
</body>
</html>
